<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="recBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1D38" />
      <stop offset="100%" stop-color="#1B2B4F" />
    </linearGradient>
    <linearGradient id="marbleDesk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#recBg)" />

  <!-- Architectural Feature Wall with Wood Slat & Gold Inlay -->
  <g opacity="0.25">
    <line x1="80" y1="0" x2="80" y2="350" stroke="#C5A880" stroke-width="1.5" />
    <line x1="120" y1="0" x2="120" y2="350" stroke="#C5A880" stroke-width="1.5" />
    <line x1="160" y1="0" x2="160" y2="350" stroke="#C5A880" stroke-width="1.5" />
    <line x1="200" y1="0" x2="200" y2="350" stroke="#C5A880" stroke-width="1.5" />
    <line x1="600" y1="0" x2="600" y2="350" stroke="#C5A880" stroke-width="1.5" />
    <line x1="640" y1="0" x2="640" y2="350" stroke="#C5A880" stroke-width="1.5" />
    <line x1="680" y1="0" x2="680" y2="350" stroke="#C5A880" stroke-width="1.5" />
    <line x1="720" y1="0" x2="720" y2="350" stroke="#C5A880" stroke-width="1.5" />
  </g>

  <!-- Polished Floor with Reflections -->
  <rect y="350" width="800" height="150" fill="#080D1A" />
  <line x1="0" y1="350" x2="800" y2="350" stroke="#C5A880" stroke-width="1" opacity="0.4" />

  <!-- Back Wall Brand Plaque Behind Reception -->
  <g transform="translate(290, 80)">
    <rect width="220" height="90" rx="8" fill="#142343" stroke="#C5A880" stroke-width="1.2" stroke-opacity="0.6" />
    <!-- Staff emblem -->
    <circle cx="110" cy="30" r="16" fill="#0F1D38" stroke="#C5A880" stroke-width="1" />
    <line x1="110" y1="20" x2="110" y2="40" stroke="#FAF9F6" stroke-width="1.5" />
    <text x="110" y="58" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="600" fill="#FAF9F6" text-anchor="middle" letter-spacing="0.08em">
      DR. ANJALI KUMARI
    </text>
    <text x="110" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" fill="#C5A880" text-anchor="middle" letter-spacing="0.16em">
      OBSTETRICS &amp; GYNECOLOGY
    </text>
  </g>

  <!-- Modern Curved Reception Counter with Warm Lighting Glow -->
  <g transform="translate(180, 240)">
    <!-- Base Glow -->
    <ellipse cx="220" cy="120" rx="260" ry="25" fill="#C5A880" opacity="0.15" />
    <!-- Front curved panel -->
    <path d="M0 40 Q220 15 440 40 L430 115 Q220 95 10 115 Z" fill="url(#marbleDesk)" stroke="#C5A880" stroke-width="1.5" />
    <!-- Top marble counter ledge -->
    <path d="M-10 40 Q220 10 450 40 Q220 20 -10 40 Z" fill="#FFFFFF" />
    <!-- Desk trim accent line -->
    <path d="M5 80 Q220 58 435 80" stroke="#9B3C53" stroke-width="2" fill="none" opacity="0.8" />
  </g>

  <!-- Waiting Lounge Armchairs -->
  <g transform="translate(60, 310)">
    <rect width="90" height="70" rx="10" fill="#FAF9F6" opacity="0.9" />
    <rect x="5" y="45" width="80" height="20" rx="6" fill="#E2DDD5" />
  </g>
  <g transform="translate(650, 310)">
    <rect width="90" height="70" rx="10" fill="#FAF9F6" opacity="0.9" />
    <rect x="5" y="45" width="80" height="20" rx="6" fill="#E2DDD5" />
  </g>

  <!-- Calming Ficus Clinic Plant -->
  <g transform="translate(160, 280)">
    <rect x="15" y="60" width="30" height="40" rx="4" fill="#C5A880" />
    <ellipse cx="25" cy="40" rx="18" ry="25" fill="#15803D" opacity="0.9" />
    <ellipse cx="38" cy="30" rx="20" ry="22" fill="#166534" opacity="0.85" />
  </g>

  <!-- Subtle Label Overlay -->
  <rect x="24" y="440" width="240" height="36" rx="6" fill="#0F1D38" fill-opacity="0.9" />
  <text x="38" y="462" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FAF9F6">
    Clinic Reception &amp; Welcome Lounge
  </text>
</svg>
