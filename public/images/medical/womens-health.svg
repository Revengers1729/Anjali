<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="wmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1D38" />
      <stop offset="60%" stop-color="#19284D" />
      <stop offset="100%" stop-color="#341A2D" />
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#wmGrad)" />

  <g opacity="0.3">
    <circle cx="300" cy="225" r="160" stroke="#C5A880" stroke-width="1.2" stroke-dasharray="3 4" />
    <circle cx="300" cy="225" r="110" stroke="#FAF9F6" stroke-width="0.8" />
  </g>

  <!-- Abstract Aesthetic Women's Health & Endocrine Harmonic Waves -->
  <g transform="translate(170, 90)">
    <!-- Harmonic wellness waves -->
    <path d="M40 180 Q80 80 130 180 T220 180" stroke="#C5A880" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
    <path d="M40 150 Q80 230 130 150 T220 150" stroke="#9B3C53" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7" />
    
    <!-- Central Shield of Health & Asclepius Balance -->
    <circle cx="130" cy="135" r="45" stroke="#FAF9F6" stroke-width="1.5" stroke-dasharray="2 3" />
    <line x1="130" y1="75" x2="130" y2="195" stroke="#FAF9F6" stroke-width="2.2" stroke-linecap="round" />
    <circle cx="130" cy="70" r="3.5" fill="#C5A880" />
    
    <!-- Protective wings/petals -->
    <path d="M130 95 C155 105 175 130 170 160 C150 150 140 135 130 95 Z" fill="#9B3C53" opacity="0.85" />
    <path d="M130 95 C105 105 85 130 90 160 C110 150 120 135 130 95 Z" fill="#C5A880" opacity="0.85" />
  </g>

  <!-- Clinical Verification Ribbon -->
  <rect x="36" y="375" width="230" height="42" rx="8" fill="#080D1A" fill-opacity="0.8" stroke="#C5A880" stroke-width="1" stroke-opacity="0.5" />
  <text x="50" y="396" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#FAF9F6">
    Preventive Women's Health
  </text>
  <text x="50" y="409" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="400" fill="#94A3B8">
    Adolescent to post-menopausal care
  </text>
</svg>
