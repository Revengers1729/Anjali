    <circle cx="40" cy="40" r="34" fill="#0F1D38" />
    
    <!-- Maternal care embrace outline -->
    <path d="M26 30 C26 21 34 16 40 16 C46 16 54 21 54 30 C54 42 40 52 40 62" 
